# ===============================
# 1. SERVER CONFIGURATION
# ===============================
# Run this on 8081 so it doesn't clash with the scaling-service (8082)
server.port=8081
spring.application.name=recipe-service

# ===============================
# 2. DATABASE CONFIGURATION (MYSQL)
# ===============================


spring.datasource.url=jdbc:mysql://localhost:3306/recipedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sa
spring.datasource.password=your_password_here
spring.datasource.driver-className=com.mysql.cj.jdbc.Driver

# Keep the database persistent across multiple context connection spans
spring.jpa.defer-datasource-initialization=true

# ===============================
# 3. JPA / HIBERNATE SETTINGS
# ===============================
# Automatically creates the tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Show SQL in the console so you can debug your Indian household measurements
spring.jpa.show-sql=true
server.servlet.context-path=/

# ===============================
# 4. FEIGN CLIENT LOGGING
# ===============================
# This helps you see the actual JSON moving between services in the IntelliJ logs
