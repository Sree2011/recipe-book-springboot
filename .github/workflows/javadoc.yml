name: Compile and Push Javadoc to Main Folder

on:
  push:
    branches:
      - main # Runs whenever you push new source files to main

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to commit back safely

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc via Maven
        run: mvn javadoc:javadoc -f recipe-service/pom.xml

      - name: Deploy Javadoc to Main Branch Folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: recipe-service/target/site/apidocs # Source folder generated by Maven
          branch: main # Deploys directly back to your main branch
          target-folder: javadoc # Automatically creates and updates the /javadoc folder