name: Compile and Push Javadoc to Main Folder

on:
  push:
    branches:
      - main

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc via Maven
        run: mvn javadoc:javadoc -f recipe-service/pom.xml

      - name: Debug Directory Structures (Just in Case)
        run: |
          echo "=== Root Folder Content ==="
          ls -R target || echo "No root target folder"
          echo "=== Module Folder Content ==="
          ls -R recipe-service/target || echo "No module target folder"

      - name: Deploy Javadoc to Main Branch Folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # FIXED PATH: Points cleanly into the module target directory
          folder: recipe-service/target/reports/apidocs
          branch: main
          target-folder: javadoc