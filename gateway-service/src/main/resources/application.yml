server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: recipe-service-recipes
          uri: http://localhost:8081
          predicates:
            - Path=/api/recipes/**


        - id: recipe-service-food
          uri: http://localhost:8081
          predicates:
            - Path=/api/food/**
          filters:
            - StripPrefix=1

        - id: scaling-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/scaling/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
